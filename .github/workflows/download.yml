name: Download Redrix Firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Fetch via Secondary Mirrors
        run: |
          mkdir -p output
          cd output
          
          # Tentative 1: Miroir secondaire et IP directes
          curl -sL -A "Mozilla/5.0" -o coreboot_redrix.rom "https://mrchromebox.net/files/firmware/full_rom/coreboot_tianocore-redrix-mrchromebox_20240519.rom" || true

          # Tentative 2: Script de secours avec recuperation du chemin exact
          if [ ! -s coreboot_redrix.rom ] || [ $(stat -c%s "coreboot_redrix.rom") -lt 1000000 ]; then
            echo "Miroir 1 echoue, tentative via l'API de deploiement..."
            curl -s https://raw.githubusercontent.com/MrChromebox/scripts/master/firmware-util.sh -o firmware-util.sh
            sed -i 's/mrchromebox.tech/mrchromebox.net/g' firmware-util.sh
            bash firmware-util.sh --download-only redrix || true
            mv ~/Downloads/*.rom . 2>/dev/null || true
          fi

          # Verification de la taille
          ls -lh

      - name: Upload ROM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: redrix-coreboot-rom
          path: output/*.rom

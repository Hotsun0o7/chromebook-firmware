name: Download Redrix Firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download Redrix ROM using Python
        run: |
          mkdir -p output
          python3 -c '
          import urllib.request
          url = "https://mrchromebox.tech/files/firmware/full_rom/coreboot_tianocore-redrix-mrchromebox_20240519.rom"
          req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64)"})
          with urllib.request.urlopen(req) as response, open("output/coreboot_redrix_mrchromebox.rom", "wb") as out_file:
              out_file.write(response.read())
          '

      - name: Upload ROM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: redrix-coreboot-rom
          path: output/*.rom

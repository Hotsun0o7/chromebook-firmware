name: Download Redrix Firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download Redrix via Official Script
        run: |
          mkdir -p output
          cd output
          # Telechargement et execution du script officiel MrChromebox en mode auto
          curl -sLO https://mrchromebox.tech/firmware-util.sh
          sudo bash firmware-util.sh --download-only redrix || true
          
          # Si le fichier s'est telecharge à la racine
          mv ~/Downloads/*.rom . 2>/dev/null || true
          mv /*.rom . 2>/dev/null || true

      - name: Upload ROM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: redrix-coreboot-rom
          path: output/*.rom

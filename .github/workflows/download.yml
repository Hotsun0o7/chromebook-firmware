name: Download Redrix Firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Force Download ROM
        run: |
          mkdir -p output
          cd output
          
          # Telechargement direct avec gestion du redirect + User-Agent complet
          curl -fL -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
               -o coreboot_redrix.rom \
               "https://mrchromebox.tech/files/firmware/full_rom/coreboot_tianocore-redrix-mrchromebox_20240519.rom" || true
          
          # Verification de la taille
          ls -lh coreboot_redrix.rom

      - name: Upload ROM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: redrix-coreboot-rom
          path: output/coreboot_redrix.rom

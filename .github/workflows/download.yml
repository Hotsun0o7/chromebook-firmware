name: Download Redrix Firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download via Python Script with Browser User-Agent
        run: |
          mkdir -p output
          python3 -c '
          import urllib.request

          url = "https://mrchromebox.tech/files/firmware/full_rom/coreboot_tianocore-redrix-mrchromebox_20240519.rom"
          headers = {
              "User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36",
              "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,*/*;q=0.8",
              "Accept-Language": "en-US,en;q=0.5",
              "Referer": "https://mrchromebox.tech/"
          }

          req = urllib.request.Request(url, headers=headers)
          try:
              with urllib.request.urlopen(req) as response, open("output/coreboot_redrix.rom", "wb") as out_file:
                  out_file.write(response.read())
              print("Download successful!")
          except Exception as e:
              print(f"Error: {e}")
          '
          ls -lh output/

      - name: Upload ROM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: redrix-coreboot-rom
          path: output/coreboot_redrix.rom
